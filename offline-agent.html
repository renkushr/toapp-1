<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#206bc4">
    <title>TOAPP Agent — Offline</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: system-ui, sans-serif;
            color: #1e293b;
            background: linear-gradient(180deg, #f8fafc, #e2e8f0);
        }
        .card {
            width: min(100%, 400px);
            padding: 28px 24px;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 18px 40px rgba(15, 23, 42, .12);
            text-align: center;
        }
        img { width: 64px; height: 64px; border-radius: 14px; margin-bottom: 12px; }
        h1 { margin: 0 0 8px; font-size: 1.25rem; }
        p { margin: 0 0 16px; color: #64748b; line-height: 1.45; }
        button {
            border: 0;
            border-radius: 999px;
            min-height: 44px;
            padding: 0 1.25rem;
            font-weight: 700;
            color: #fff;
            background: #206bc4;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/assets/global/img/pwa/icon-192.png" alt="TOAPP Agent">
        <h1>You're offline</h1>
        <p>Agent needs a connection. Reconnect, then retry.</p>
        <button type="button" onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
